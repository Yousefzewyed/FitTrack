<!-- MAIN -->
<main class="main">

  <div class="page-title" style="animation:fadeUp .4s ease both">
    <h1>Dashboard</h1>
    <p>Track your fitness journey and in-body analytics</p>
  </div>

  <!-- STAT CARDS -->
  <div class="stats-grid">
    <div class="stat-card bmi">
      <div class="stat-icon gold">⚖️</div>
      <div class="stat-label">BMI</div>
      <div class="stat-val" id="bmiVal"></div>
      <div class="stat-sub">Normal range</div>
    </div>
    <div class="stat-card fat">
      <div class="stat-icon teal">🔥</div>
      <div class="stat-label">Body Fat</div>
      <div class="stat-val" id="fatVal"><span class="stat-unit">%</span></div>
      <div class="stat-sub">Fitness range</div>
    </div>
    <div class="stat-card muscle">
      <div class="stat-icon green">💪</div>
      <div class="stat-label">Muscle Mass</div>
      <div class="stat-val" id="muscleVal"><span class="stat-unit">kg</span></div>
      <div class="stat-sub">Above average</div>
    </div>
    <div class="stat-card bmr">
      <div class="stat-icon orange">⚡</div>
      <div class="stat-label">BMR</div>
      <div class="stat-val" id="bmrVal"><span class="stat-unit">kcal</span></div>
      <div class="stat-sub">Daily at rest</div>
    </div>
  </div>

 


</main>
<script> 

document.addEventListener("DOMContentLoaded", function() {
    const currentPath = window.location.pathname.toLowerCase();

    document.querySelectorAll('.nav-link').forEach(link => {
        const linkHref = link.getAttribute('href').toLowerCase();

        if (currentPath.includes(linkHref) && linkHref !== "#" && linkHref !== "") {
            link.classList.add('active');
            console.log("Matched: " + linkHref);
                  } else {
            link.classList.remove('active');
        }
    });
});

window.onload = function() {
  const weight = parseFloat(localStorage.getItem('user_weight'));
  const height = parseFloat(localStorage.getItem('user_height'));
  const age = parseInt(localStorage.getItem('user_age'));
  const gender = localStorage.getItem('user_gender');

  if (!weight || !height || !age || !gender) return;

  const heightInMeters = height / 100;
  const bmi = weight / (heightInMeters * heightInMeters);

  let bmr = (gender === 'male') 
    ? (10 * weight) + (6.25 * height) - (5 * age) + 5 
    : (10 * weight) + (6.25 * height) - (5 * age) - 161;

  let bodyFat = (gender === 'male') 
    ? (1.20 * bmi) + (0.23 * age) - 16.2 
    : (1.20 * bmi) + (0.23 * age) - 5.4;
  bodyFat = Math.max(bodyFat, 2);

  const fatWeight = weight * (bodyFat / 100);
  const muscleMass = weight - fatWeight;

  // رمي النتايج جوه المربعات اللي في الـ HTML
  document.getElementById('bmiVal').innerText = bmi.toFixed(1);
  document.getElementById('fatVal').innerText = bodyFat.toFixed(1) + ' %';
  document.getElementById('muscleVal').innerText = muscleMass.toFixed(1) + ' Kg';
  document.getElementById('bmrVal').innerText = Math.round(bmr) + ' Kcal';
};
</script>
